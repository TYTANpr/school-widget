name: Update Schedule

on:
  schedule:
    - cron: '*/30 4-19 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run 10A parser
        run: python parser.py

      - name: Run 7B parser
        run: python parser_7b.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today_10a.txt today_7b.txt
          git commit -m "Auto update schedules 10A & 7B" || echo "Нет новых изменений"
          git push || echo "Нечего отправлять"
