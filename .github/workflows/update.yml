name: Update Schedule

on:
  workflow_dispatch:

permissions:
  contents: write

# Запрещаем одновременный запуск двух копий (защита от конфликта файлов)
concurrency:
  group: schedule-updater
  cancel-in-progress: false

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run 10A parser (Виджет + Telegram)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
        run: python parser.py

      - name: Run 7B parser (Только виджет)
        run: python parser_7b.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto update schedules 10A & 7B"
            git pull --rebase origin main
            git push
          else
            echo "Нет новых изменений"
          fi
