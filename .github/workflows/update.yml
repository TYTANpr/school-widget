name: Update Schedule

on:
  schedule:
    # Запуск каждые 30 минут с 6:00 до 16:00 по МСК (Пн-Сб)
    - cron: '*/30 3-13 * * 1-6'
  workflow_dispatch: # возможность запустить вручную кнопкой

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run parser
        run: python parser.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today_10a.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update schedule" && git push)
